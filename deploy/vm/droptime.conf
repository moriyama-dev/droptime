# DropTime — 開発 VM 用の Apache 設定（Tailscale 内でのみ到達可能な想定）
# 本番（DreamHost 共有ホスティング）ではこのファイルは使わない。パネル設定で行う。
<VirtualHost *:80>
    # 唯一の有効サイトなので、どのホスト名で来ても DropTime を返す。
    ServerName droptime.vm
    ServerAlias *

    DocumentRoot /home/yoshi/droptime/public

    <Directory /home/yoshi/droptime/public>
        Options -Indexes -MultiViews
        AllowOverride All
        Require all granted
    </Directory>

    # 本番（memory_limit 128M）に合わせる。アップロード上限はヒートシート PDF 想定。
    php_admin_value memory_limit 128M
    php_admin_value upload_max_filesize 64M
    php_admin_value post_max_size 64M

    ErrorLog ${APACHE_LOG_DIR}/droptime-error.log
    CustomLog ${APACHE_LOG_DIR}/droptime-access.log combined
</VirtualHost>
